name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  neural-network:
    # Needs enable_testing() + add_test(NAME xor COMMAND neural_network)
    # in neural-network/CMakeLists.txt.
    uses: cear12/ci-workflows/.github/workflows/cmake.yml@v1
    with:
      source-dir: neural-network

  opencv-vision:
    # OpenCV is an apt install on Ubuntu; Windows/macOS would need vcpkg/brew
    # builds of opencv4[contrib], so this job stays Linux-only (build check).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenCV (with contrib for the tracking module)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev libopencv-contrib-dev opencv-data

      - name: Copy Haar cascades into data/
        run: |
          mkdir -p opencv-vision/data
          for f in haarcascade_frontalface_alt.xml haarcascade_eye_tree_eyeglasses.xml; do
            src=$(find /usr/share -iname "$f" 2>/dev/null | head -1)
            [ -n "$src" ] && cp "$src" opencv-vision/data/
          done
          ls -la opencv-vision/data/

      - name: Configure
        run: cmake -S opencv-vision -B build-cv -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cv --parallel

      - name: Binary exists
        run: test -x build-cv/opencv_vision
